<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="الملف الشخصي في مدونتي">
  <title>الملف الشخصي - مدونتي</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-salem fixed-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-salem" href="index.html">
        <div class="brand-icon">م</div>
        <div class="brand-text"><span class="brand-name">مدونتي</span></div>
      </a>
      <button class="navbar-toggler navbar-toggler-salem" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-home ms-1"></i> الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link" href="articles.html"><i class="fas fa-newspaper ms-1"></i> المقالات</a></li>
          <li class="nav-item"><a class="nav-link" href="categories.html"><i class="fas fa-th-large ms-1"></i> التصنيفات</a></li>
          <li class="nav-item"><a class="nav-link" href="add-article.html"><i class="fas fa-plus-circle ms-1"></i> إضافة مقال</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html"><i class="fas fa-info-circle ms-1"></i> من نحن</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html"><i class="fas fa-envelope ms-1"></i> تواصل معنا</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a href="profile.html" class="btn btn-outline-light btn-sm"><i class="fas fa-user ms-1"></i> البروفايل</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top: 100px; padding-bottom: 60px;">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 mb-4 p-4 text-center" style="border-radius: 16px;">
          <img id="profile-avatar" src="https://ui-avatars.com/api/?name=U&background=random" class="rounded-circle mx-auto mb-3" style="width:120px;height:120px;border:3px solid var(--accent);" alt="صورة المستخدم">
          <h4 id="profile-name" class="fw-bold mb-1">--</h4>
          <p id="profile-role" class="text-muted mb-3">--</p>
          <p id="profile-email" class="small text-muted mb-4">--</p>

          <div class="d-flex justify-content-center gap-2 mb-4">
            <div class="profile-mini-stat">
              <strong id="profile-articles-count">0</strong>
              <span>مقال</span>
            </div>
            <div class="profile-mini-stat">
              <strong id="profile-bookmarks-count">0</strong>
              <span>محفوظ</span>
            </div>
            <div class="profile-mini-stat">
              <strong id="profile-sources-count">0</strong>
              <span>مصدر</span>
            </div>
          </div>

          <div class="d-grid gap-2">
            <a href="add-article.html" class="btn btn-outline-secondary rounded-pill"><i class="fas fa-pen ms-1"></i> اكتب مقالًا</a>
            <a href="#" onclick="event.preventDefault(); AuthService.logout()" class="btn btn-outline-danger rounded-pill"><i class="fas fa-sign-out-alt ms-1"></i> تسجيل الخروج</a>
          </div>
        </div>

        <div class="card shadow-sm border-0 p-4" style="border-radius: 16px;">
          <h5 class="fw-bold mb-3"><i class="fas fa-address-card ms-2 text-muted"></i>نبذة</h5>
          <p id="profile-bio" class="text-muted mb-3" style="line-height: 1.9;">--</p>
          <ul class="list-unstyled m-0 small text-muted">
            <li class="mb-2"><i class="fas fa-map-marker-alt ms-2"></i><span id="profile-location">--</span></li>
            <li class="mb-2"><i class="fas fa-calendar-alt ms-2"></i><span id="profile-joined">--</span></li>
            <li><i class="fas fa-link ms-2"></i><a id="profile-website" href="#" target="_blank" rel="noopener noreferrer">--</a></li>
          </ul>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card shadow-sm border-0" style="border-radius: 16px;">
          <div class="card-header bg-transparent border-0 pt-4 pb-0 px-4">
            <ul class="nav nav-tabs border-0" id="profileTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold px-4" id="articles-tab" data-bs-toggle="tab" data-bs-target="#userArticles" type="button" role="tab">مقالاتي</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold px-4" id="saved-tab" data-bs-toggle="tab" data-bs-target="#userSaved" type="button" role="tab">المحفوظات</button>
              </li>
            </ul>
            <hr class="mt-0 mb-4" style="border-color: rgba(0,0,0,.08);">
          </div>

          <div class="card-body px-4 pb-4">
            <div class="tab-content" id="profileTabsContent">
              <div class="tab-pane fade show active" id="userArticles" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h5 id="profile-articles-title" class="fw-bold m-0">مقالاتي</h5>
                  <a href="add-article.html" class="btn btn-sm read-more-btn"><i class="fas fa-plus ms-1"></i> مقال جديد</a>
                </div>
                <div id="profile-articles-list" class="d-flex flex-column gap-3"></div>
              </div>

              <div class="tab-pane fade" id="userSaved" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h5 id="profile-saved-title" class="fw-bold m-0">المحفوظات</h5>
                  <a href="articles.html" class="btn btn-sm btn-outline-secondary rounded-pill">تصفح المقالات</a>
                </div>
                <div id="profile-saved-list" class="d-flex flex-column gap-3"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-section"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
