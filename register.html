<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تسجيل حساب جديد في مدونتي">
  <title>تسجيل حساب جديد - مدونتي</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
</head>
<body style="background-color: var(--bg-color);">

  <!-- Navbar Basic -->
  <nav class="navbar navbar-expand-lg navbar-salem fixed-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-salem mx-auto" href="index.html">
        <div class="brand-icon">م</div>
        <div class="brand-text">
          <span class="brand-name">مدونتي</span>
        </div>
      </a>
    </div>
  </nav>

  <!-- Register Form -->
  <div class="container d-flex align-items-center justify-content-center min-vh-100" style="padding-top: 80px; padding-bottom: 40px;">
    <div class="card shadow-lg border-0" style="max-width: 500px; width: 100%; border-radius: 16px; background-color: var(--card-bg);">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3 d-flex align-items-center justify-content-center text-white" style="width: 65px; height: 65px; font-size: 2rem; border-radius: 16px; background: var(--gradient-hero);">
            <i class="fas fa-user-plus"></i>
          </div>
          <h2 class="fw-bold" style="color: var(--text-color); font-family: var(--font-heading);">تسجيل حساب</h2>
          <p style="color: var(--gray-400); font-size: 0.95rem;">انضم إلى مجتمع مدونتي التقني</p>
        </div>
        
        <form onsubmit="event.preventDefault(); typeof AuthService !== 'undefined' ? AuthService.register(this.querySelectorAll('input[type=text]')[0].value, this.querySelector('input[type=email]').value, this.querySelectorAll('input[type=password]')[0].value) : window.location.href='index.html';">
          <div class="mb-3">
            <label class="form-label" style="color: var(--text-color); font-weight: 600;">الاسم الكامل</label>
            <div class="input-group">
              <span class="input-group-text border-0" style="background: rgba(255,255,255,0.05); color: var(--gray-400);"><i class="fas fa-user"></i></span>
              <input type="text" class="form-control border-0" style="background: rgba(255,255,255,0.05); color: var(--text-color);" placeholder="أدخل اسمك الكامل" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" style="color: var(--text-color); font-weight: 600;">البريد الإلكتروني</label>
            <div class="input-group">
              <span class="input-group-text border-0" style="background: rgba(255,255,255,0.05); color: var(--gray-400);"><i class="fas fa-envelope"></i></span>
              <input type="email" class="form-control border-0" style="background: rgba(255,255,255,0.05); color: var(--text-color);" placeholder="example@domain.com" required>
            </div>
          </div>
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" style="color: var(--text-color); font-weight: 600;">كلمة المرور</label>
              <div class="input-group">
                <span class="input-group-text border-0" style="background: rgba(255,255,255,0.05); color: var(--gray-400);"><i class="fas fa-lock"></i></span>
                <input type="password" class="form-control border-0" style="background: rgba(255,255,255,0.05); color: var(--text-color);" placeholder="********" required>
              </div>
            </div>
            <div class="col-md-6 mb-4">
              <label class="form-label" style="color: var(--text-color); font-weight: 600;">تأكيد المرور</label>
              <div class="input-group">
                <span class="input-group-text border-0" style="background: rgba(255,255,255,0.05); color: var(--gray-400);"><i class="fas fa-lock"></i></span>
                <input type="password" class="form-control border-0" style="background: rgba(255,255,255,0.05); color: var(--text-color);" placeholder="********" required>
              </div>
            </div>
          </div>
          
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="termsCheck" required>
            <label class="form-check-label" for="termsCheck" style="color: var(--gray-400); font-size: 0.85rem;">
              أوافق على <a href="#" style="color: var(--accent);">شروط الاستخدام</a> و <a href="#" style="color: var(--accent);">سياسة الخصوصية</a>
            </label>
          </div>
          
          <button type="submit" class="btn w-100 text-white py-2 mb-3 fw-bold" style="background: var(--gradient-hero); border-radius: 8px; border: none;">
            إنشاء حساب <i class="fas fa-plus-circle ms-1"></i>
          </button>
          
          <p class="text-center mb-0" style="color: var(--gray-400); font-size: 0.95rem;">
            لديك حساب بالفعل؟ 
            <a href="login.html" class="text-decoration-none fw-bold" style="color: var(--gold);">تسجيل الدخول</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
